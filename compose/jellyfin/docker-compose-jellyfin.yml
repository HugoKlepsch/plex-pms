name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      - PUID=${PLEX_UID}
      - PGID=${PLEX_GID}
      - UMASK=002
      - TZ=${PLEX_TZONE}
      # Advertised URL clients are handed for direct connections
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}
    # Host networking so DLNA & client auto-discovery (UDP 1900 / 7359) work,
    # same as plex2. Ports used: 8096 (HTTP), 8920 (HTTPS), 1900, 7359.
    network_mode: host
    devices:
      # Intel QSV / VAAPI hardware transcoding
      - /dev/dri:/dev/dri
    volumes:
      - ${JELLYFIN_CONFIG_DIR}:/config
      # Transcodes & images land here; keep it off the NAS mount
      - ${JELLYFIN_CACHE_DIR}:/cache
      - ${JELLYFIN_DATA_DIR}:/data/media
